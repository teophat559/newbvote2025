# /etc/apache2/sites-available/newbvote2025s-80.conf (Ubuntu/Debian)
# or /etc/httpd/conf.d/newbvote2025s-80.conf (RHEL/CentOS/Alma)

<VirtualHost *:80>
    ServerName newbvote2025s.online
    ServerAlias www.newbvote2025s.online

    # Redirect everything to HTTPS, except ACME challenge path
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    # Optionally serve ACME challenges without redirect
    Alias /.well-known/acme-challenge/ "/home/newbvote2025s.online/public_html/.well-known/acme-challenge/"
    <Directory "/home/newbvote2025s.online/public_html/.well-known/acme-challenge/">
        Require all granted
        Options -Indexes
        AllowOverride None
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/newbvote2025s-http.error.log
    CustomLog ${APACHE_LOG_DIR}/newbvote2025s-http.access.log combined
</VirtualHost>
