# /etc/apache2/sites-available/newbvote2025s-443.conf (Ubuntu/Debian)
# or /etc/httpd/conf.d/newbvote2025s-443.conf (RHEL/CentOS/Alma)

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName newbvote2025s.online
    ServerAlias www.newbvote2025s.online

    DocumentRoot /home/newbvote2025s.online/public_html/public

    # Allow .htaccess in project root and public
    <Directory /home/newbvote2025s.online/public_html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /home/newbvote2025s.online/public_html/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Security headers (complement .htaccess)
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"

    # WebSocket proxy to Ratchet at 127.0.0.1:8090
    ProxyPreserveHost On
    ProxyRequests Off

    # HTTP proxy (if you also expose HTTP endpoints under /api via a different service)
    #ProxyPass /api http://127.0.0.1:8080/api
    #ProxyPassReverse /api http://127.0.0.1:8080/api

    # WS proxy
    ProxyPass "/ws"  "ws://127.0.0.1:8090/ws"
    ProxyPassReverse "/ws"  "ws://127.0.0.1:8090/ws"

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/newbvote2025s-ssl.error.log
    CustomLog ${APACHE_LOG_DIR}/newbvote2025s-ssl.access.log combined

    # SSL
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/newbvote2025s.online/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/newbvote2025s.online/privkey.pem

    # Modern TLS (Apache 2.4.36+)
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          TLSv1.2+HIGH:!aNULL:!MD5
    SSLHonorCipherOrder     on
    SSLCompression          off
    SSLUseStapling          on
    SSLStaplingCache        shmcb:/var/run/ocsp(128000)

    # HSTS (optional)
    #Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
</VirtualHost>
</IfModule>

