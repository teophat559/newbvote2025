# Production PHP Configuration for Newb Vote 2025s
# Place in /etc/php/8.1/apache2/conf.d/99-newbvote2025s-production.ini
# or include in your main php.ini file

[Production Settings]
; Hide PHP version information
expose_php = Off

; Error handling for production
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php_errors.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Security settings
allow_url_fopen = Off
allow_url_include = Off
enable_dl = Off

; Session security (supplementing runtime settings)
session.cookie_secure = On
session.cookie_httponly = On
session.use_strict_mode = On
session.cookie_samesite = Strict
session.gc_maxlifetime = 3600

; File uploads
upload_max_filesize = 5M
post_max_size = 10M
max_file_uploads = 3

; Performance settings
memory_limit = 256M
max_execution_time = 30
max_input_time = 60

; OPcache for production (enable if not already enabled)
opcache.enable = On
opcache.enable_cli = Off
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 4000
opcache.revalidate_freq = 2
opcache.fast_shutdown = On
opcache.validate_timestamps = Off

; Disable dangerous functions
disable_functions = exec,system,shell_exec,passthru,eval,base64_decode,file_get_contents,fopen,fwrite,fclose,readfile,fpassthru,fsockopen,pfsockopen,show_source,highlight_file

; Additional security
auto_globals_jit = On
register_argc_argv = Off